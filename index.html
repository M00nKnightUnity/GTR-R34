<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Auto-play Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        
        video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
        }
        
        iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.2);
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://streamable.com/e/vreawh?autoplay=1&nocontrols=1&muted=1" 
        allow="autoplay; fullscreen" 
        allowfullscreen
        frameborder="0">
    </iframe>
</body>
</html>
